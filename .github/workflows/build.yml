# Builds and tests looma on two Loom JDKs of openjdk/loom pull request 227, built from source:
# the first one, with Thread.Affinity, and a later one, without it.
# Adapted from the upstream Netty-VirtualThread-Scheduler project's
# .github/workflows/loom-tests.yml.
#
# One JDK per job: Maven runs on the Loom JDK itself, so there is nothing to set up beyond pointing
# JAVA_HOME at it. The runner's preinstalled Maven is used as-is.
#
# There is no binary of these JDKs. The job builds each one once per commit and keeps it in the
# Actions cache: the first run builds it, the next ones restore it. A cache saved on main serves
# every pull request. GitHub drops a cache that no run has read for 7 days; the next run then
# builds it again. The boot JDK is the Loom build of builds.shipilev.net, a JDK 28.
name: Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  # Everything, on each Loom JDK: core, examples AND mpsc-scheduler, which the root pom's
  # loom-jdk profile only adds to the reactor on JDK 28+.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    strategy:
      fail-fast: false
      matrix:
        include:
          # The commit of openjdk/loom pull request 227, the same as in the README. It has
          # Thread.Affinity.
          - name: pr227
            sha: 5766f815f7248a52bae73950b1c7a32532b872c0
            affinity: true
          # A later commit of the same repository, branch mpsc-without-affinity. It has no
          # Thread.Affinity. Fixed, not the branch head: update it by hand.
          - name: noaff
            sha: 33d7cd32dc9402386565878b8fcb0d5b664362e1
            affinity: false

    name: build (${{ matrix.name }})

    env:
      LOOM_SHA: ${{ matrix.sha }}
      BOOT_JDK_URL: https://builds.shipilev.net/openjdk-jdk-loom/openjdk-jdk-loom-linux-x86_64-server.tar.xz

    steps:
      - uses: actions/checkout@v7

      # The cache refuses a path with "." or "..", so the JDK lives in the runner's temp
      # directory, an absolute path. It is set here because the job's env cannot read it.
      - name: Choose where the Loom JDK lives
        run: echo "LOOM_JDK=$RUNNER_TEMP/loom-jdk-${{ matrix.name }}" >> "$GITHUB_ENV"

      - name: Restore the Loom JDK
        id: jdk-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.LOOM_JDK }}
          key: loom-jdk-${{ matrix.name }}-${{ env.LOOM_SHA }}

      - name: Build the Loom JDK
        if: steps.jdk-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          sudo apt-get update -q
          sudo apt-get install -y -q autoconf libasound2-dev libcups2-dev libfontconfig1-dev \
            libx11-dev libxext-dev libxrender-dev libxrandr-dev libxtst-dev libxt-dev
          boot="$RUNNER_TEMP/boot-jdk"
          mkdir -p "$boot"
          curl -fsSL "$BOOT_JDK_URL" | tar -xJ -C "$boot" --strip-components=1
          src="$RUNNER_TEMP/loom-src"
          mkdir -p "$src"
          curl -fsSL "https://github.com/franz1981/loom/archive/$LOOM_SHA.tar.gz" \
            | tar -xz -C "$src" --strip-components=1
          cd "$src"
          bash configure --with-boot-jdk="$boot" --disable-warnings-as-errors \
            --with-native-debug-symbols=none --with-version-opt="${{ matrix.name }}-${LOOM_SHA:0:7}"
          make images
          mkdir -p "$LOOM_JDK"
          cp -a build/linux-x86_64-server-release/images/jdk/. "$LOOM_JDK/"

      # Saved right after the build, so that a test failure below does not throw it away.
      - name: Save the Loom JDK
        if: steps.jdk-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ env.LOOM_JDK }}
          key: loom-jdk-${{ matrix.name }}-${{ env.LOOM_SHA }}

      # The tests skip what this JDK cannot do: check that it is the JDK the matrix names.
      - name: Check the Loom JDK
        run: |
          set -euo pipefail
          "$LOOM_JDK/bin/java" -version
          if "$LOOM_JDK/bin/javap" 'java.lang.Thread$Affinity' >/dev/null 2>&1; then
            has=true
          else
            has=false
          fi
          echo "Thread.Affinity: $has (expected ${{ matrix.affinity }})"
          if [ "$has" != "${{ matrix.affinity }}" ]; then
            echo "::error::Thread.Affinity is $has in this JDK, expected ${{ matrix.affinity }}"
            exit 1
          fi

      # The Loom JDK's major version must be mpsc-scheduler's <java.version>. Without this
      # check a mismatch surfaces as an opaque compiler error.
      #
      # That module's java.version is the one to compare, NOT the root pom's: the root sets 25
      # (core and examples compile at release=25 and run on a stock JDK), and only
      # the scheduler module follows the Loom JDK's own major version.
      - name: Assert the Loom JDK major version matches mpsc-scheduler
        run: |
          set -euo pipefail
          # "|| true" on each pipeline is deliberate: under `set -e -o pipefail` a grep that
          # matches nothing would abort here with no message -- these are meant to end up empty
          # so the "-z" checks below can report something actionable instead.
          expected=$(grep -oE '<java\.version>[0-9]+</java\.version>' mpsc-scheduler/pom.xml \
            | grep -oE '[0-9]+' || true)
          if [ -z "$expected" ]; then
            echo "::error::Could not find <java.version> in mpsc-scheduler/pom.xml"
            exit 1
          fi
          actual=$("$LOOM_JDK/bin/java" -XshowSettings:properties -version 2>&1 \
            | grep 'java.specification.version' | grep -oE '[0-9]+' | head -1 || true)
          if [ -z "$actual" ]; then
            echo "::error::Could not determine the Loom JDK's major version"
            exit 1
          fi
          echo "mpsc-scheduler java.version: $expected"
          echo "Loom JDK major version:      $actual"
          if [ "$expected" != "$actual" ]; then
            echo "::error::Loom JDK major version ($actual) does not match <java.version>" \
              "($expected) in mpsc-scheduler/pom.xml."
            exit 1
          fi

      # The dependency cache.
      - name: Cache Maven repository
        uses: actions/cache@v6
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2-

      # CI must CHECK formatting, not rewrite it: "-P '!dev'" disables the profile that applies
      # Spotless at compile time, leaving only the spotless:check bound to verify. "verify" also
      # runs core's single Surefire execution (the JDK builtin) and mpsc-scheduler's: the
      # suites and install.
      - name: Build with Maven
        env:
          JAVA_HOME: ${{ env.LOOM_JDK }}
        run: mvn -B verify --file pom.xml -P '!dev'

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-${{ matrix.name }}
          path: |
            **/target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 7

  # The other half of the promise: core and examples compile at release=25 and run on
  # a stock JDK, with no preview flag and no scheduler module in the reactor (the loom-jdk profile
  # does not activate here). Without this job the JDK-builtin path -- the reason the SPI exists --
  # would only ever be verified by hand.
  build-jdk25:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Set up a stock JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Cache Maven repository
        uses: actions/cache@v6
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-jdk25-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2-jdk25-

      - name: Build with Maven
        run: mvn -B verify --file pom.xml -P '!dev'

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-jdk25
          path: |
            **/target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 7
