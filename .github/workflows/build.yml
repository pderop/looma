# Builds and tests looma against a fresh Loom JDK pulled from builds.shipilev.net.
# Adapted from the upstream Netty-VirtualThread-Scheduler project's
# .github/workflows/loom-tests.yml.
#
# One JDK: Maven runs on the Loom JDK itself, so there is nothing to set up beyond pointing
# JAVA_HOME at the extracted image. The runner's preinstalled Maven is used as-is.
#
# The JDK is downloaded rather than taken from the `shipilev/openjdk:loom` container image
# because builds.shipilev.net is rebuilt continuously: together with the nightly cron below,
# that is what catches an upstream Loom regression instead of it going unnoticed until someone
# next pushes here.
name: Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    # Nightly at 02:00 UTC. builds.shipilev.net overwrites the tarball in place -- there is no
    # versioned/"latest" alias -- so this cron is the only thing that re-tests against a moving
    # upstream.
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  # Everything, on the Loom JDK: core, examples AND netty-loom-scheduler, which the
  # root pom's loom-jdk profile only adds to the reactor on JDK 28+.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      LOOM_JDK_URL: https://builds.shipilev.net/openjdk-jdk-loom/openjdk-jdk-loom-linux-x86_64-server.tar.xz

    steps:
      - uses: actions/checkout@v7

      - name: Download and extract the Loom JDK
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/loom-jdk.tar.xz" "$LOOM_JDK_URL"
          mkdir -p "$RUNNER_TEMP/loom-jdk"
          # The tarball's single top-level entry is "jdk/" (verified with `tar -tJf`), so
          # --strip-components=1 is what makes "$RUNNER_TEMP/loom-jdk/bin/java" exist directly.
          tar -xJf "$RUNNER_TEMP/loom-jdk.tar.xz" -C "$RUNNER_TEMP/loom-jdk" --strip-components=1
          rm -f "$RUNNER_TEMP/loom-jdk.tar.xz"
          "$RUNNER_TEMP/loom-jdk/bin/java" -version

      # The shipilev Loom build's major version moves forward over time. Without this check a
      # bump surfaces as an opaque compiler error instead of a clear message telling you to bump
      # <java.version> in netty-loom-scheduler/pom.xml.
      #
      # That module's java.version is the one to compare, NOT the root pom's: the root sets 25
      # (core and examples compile at release=25 and run on a stock JDK), and only
      # the scheduler module -- the one built with --enable-preview against the virtual thread
      # scheduler SPI -- follows the Loom JDK's own major version.
      - name: Assert the Loom JDK major version matches netty-loom-scheduler
        run: |
          set -euo pipefail
          # "|| true" on each pipeline is deliberate: under `set -e -o pipefail` a grep that
          # matches nothing would abort here with no message -- these are meant to end up empty
          # so the "-z" checks below can report something actionable instead.
          expected=$(grep -oE '<java\.version>[0-9]+</java\.version>' netty-loom-scheduler/pom.xml \
            | grep -oE '[0-9]+' || true)
          if [ -z "$expected" ]; then
            echo "::error::Could not find <java.version> in netty-loom-scheduler/pom.xml"
            exit 1
          fi
          actual=$("$RUNNER_TEMP/loom-jdk/bin/java" -XshowSettings:properties -version 2>&1 \
            | grep 'java.specification.version' | grep -oE '[0-9]+' | head -1 || true)
          if [ -z "$actual" ]; then
            echo "::error::Could not determine the extracted Loom JDK's major version"
            exit 1
          fi
          echo "netty-loom-scheduler java.version: $expected"
          echo "Extracted Loom JDK major version:  $actual"
          if [ "$expected" != "$actual" ]; then
            echo "::error::Loom JDK major version ($actual) does not match <java.version>" \
              "($expected) in netty-loom-scheduler/pom.xml. The shipilev Loom build has likely" \
              "moved to a new major version -- bump <java.version> there before this build can pass."
            exit 1
          fi

      # Only the dependency cache. Deliberately does NOT cache the extracted Loom JDK: the
      # shipilev tarball is overwritten in place with no versioned alias, so a stable cache key
      # would pin a stale JDK forever and the nightly cron above would stop testing anything new.
      - name: Cache Maven repository
        uses: actions/cache@v6
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2-

      # CI must CHECK formatting, not rewrite it: "-P '!dev'" disables the profile that applies
      # Spotless at compile time, leaving only the spotless:check bound to verify. "verify" also
      # runs core's single Surefire execution (the JDK builtin) and all four of
      # netty-loom-scheduler's -- the vendored scheduler's own tests, carrier, work stealing,
      # replaceBuiltinScheduler.
      - name: Build with Maven
        env:
          JAVA_HOME: ${{ runner.temp }}/loom-jdk
        run: mvn -B verify --file pom.xml -P '!dev'

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            **/target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 7

  # The other half of the promise: core and examples compile at release=25 and run on
  # a stock JDK, with no preview flag and no scheduler module in the reactor (the loom-jdk profile
  # does not activate here). Without this job the JDK-builtin path -- the reason the SPI exists --
  # would only ever be verified by hand.
  build-jdk25:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Set up a stock JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Cache Maven repository
        uses: actions/cache@v6
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-jdk25-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2-jdk25-

      - name: Build with Maven
        run: mvn -B verify --file pom.xml -P '!dev'

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-jdk25
          path: |
            **/target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 7
