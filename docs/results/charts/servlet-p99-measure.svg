<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 388" width="900" height="388" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
<style>
svg { --surface: #fcfcfb; --text: #0b0b0b; --text2: #52514e; --muted: #898781; --grid: #e1e0d9; --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4; --s6: #008300 }
