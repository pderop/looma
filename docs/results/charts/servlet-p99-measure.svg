.bg { fill: var(--surface) } .t { fill: var(--text) } .t2 { fill: var(--text2) } .m { fill: var(--muted) }
.g { stroke: var(--grid); stroke-width: 1 } .g1 { stroke: var(--muted); stroke-width: 1 }
