<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" width="900" height="460" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
<style>
svg { --surface: #fcfcfb; --text: #0b0b0b; --text2: #52514e; --muted: #898781; --grid: #e1e0d9; --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a }
@media (prefers-color-scheme: dark) { svg { --surface: #1a1a19; --text: #f0efec; --text2: #c3c2b7; --muted: #898781; --grid: #2c2c2a; --s1: #3987e5; --s2: #d95926; --s3: #199e70 } }
.bg { fill: var(--surface) } .t { fill: var(--text) } .t2 { fill: var(--text2) } .m { fill: var(--muted) }
.g { stroke: var(--grid); stroke-width: 1 } .g1 { stroke: var(--muted); stroke-width: 1 }
.l { fill: none; stroke-width: 2.2; stroke-linejoin: round; stroke-linecap: round } .dashed { stroke-dasharray: 7 4 }
.c1 { stroke: var(--s1) } .c2 { stroke: var(--s2) } .c3 { stroke: var(--s3) }
.d1 { fill: var(--s1) } .d2 { fill: var(--s2) } .d3 { fill: var(--s3) } .ring { stroke: var(--surface); stroke-width: 2 }
</style>
