# Logging of the test runs only: surefire points java.util.logging here (see pom.xml).
#
# Looma logs a warning, with its stack trace, for each failure an actor survives. Many tests make
# actors fail on purpose. Each warning stays, on one line, without its stack trace.
handlers = java.util.logging.ConsoleHandler
.level = INFO
java.util.logging.ConsoleHandler.level = ALL
# 4 = level, 3 = logger, 5 = message. 6, the exception and its stack trace, is left out.
java.util.logging.SimpleFormatter.format = %4$s %3$s: %5$s%n
